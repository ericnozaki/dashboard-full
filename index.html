<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Sete Laser - Full & Fábrica</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @media print {
            body { background: white !important; color: black !important; }
            header, .flex.gap-1, #loading, .conteudo-aba, #modal-config { display: none !important; }
            #area-relatorio-pdf { display: block !important; width: 100%; padding: 0; margin: 0; font-size: 11px; }
            table { page-break-inside: auto; }
            tr { page-break-inside: avoid; page-break-after: auto; }
            td, th { padding: 4px 6px !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 md:p-6 pb-20">
    <div class="w-full max-w-xl md:max-w-7xl mx-auto">
        
        <header class="mb-4 flex flex-col md:flex-row justify-between items-center bg-slate-800 p-4 rounded-xl shadow-md border border-slate-700 gap-3">
            <div>
                <h1 class="text-xl md:text-2xl font-black tracking-tight text-white">📦 Painel Sete Laser</h1>
                <p class="text-slate-400 text-[10px] md:text-xs uppercase font-bold tracking-wider">Gestão Full, Fábrica & Finanças</p>
            </div>
            <div class="flex flex-wrap gap-2 w-full md:w-auto justify-end">
                <button onclick="gerarRelatorioPDF()" class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-2 rounded-lg font-bold transition text-xs shadow-md">🖨️ Relatório PDF</button>
                <button onclick="sincronizarPrecosML()" id="btn-sync" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-2 rounded-lg font-bold transition text-xs shadow-md">🔄 Sync ML</button>
                <button onclick="abrirConfiguracoes()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg transition shadow-md">⚙️ Configurações</button>
            </div>
        </header>

        <div id="loading" class="text-center py-12 text-slate-400 text-sm animate-pulse">⚡ Conectando ao painel...</div>

        <div id="aba-envio" class="conteudo-aba space-y-4">
            <div id="lista-produtos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
        </div>
    </div>

    <!-- MODAL DE CONFIGURAÇÕES -->
    <div id="modal-config" class="hidden fixed inset-0 bg-black/90 z-50 overflow-y-auto p-4 pb-24">
        <div class="w-full max-w-2xl mx-auto bg-slate-800 rounded-xl border border-slate-600 shadow-2xl p-6">
            <h2 class="text-lg font-bold text-white mb-4">⚙️ Configurações</h2>
            <div id="lista-regras" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[70vh] overflow-y-auto"></div>
            <button onclick="salvarConfiguracoes()" class="w-full mt-6 bg-green-600 py-3 rounded-lg font-bold">💾 Salvar na Nuvem</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nelpiazjlgwgmasaaxfg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5lbHBpYXpqbGd3Z21hc2FheGZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MDIyMjgsImV4cCI6MjEwMTM3ODIyOH0.433rc-W0GjIY3tii3-cnBJbtr1WX1ZbB50Htvv_Po90';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let produtosGlobais = [];
        let configApp = { diasMeta: 30, periodoBase: 30, margemSeguranca: 30, imposto: 6.0 };
        let catalogoChapas = { "PS 2mm": 76.00, "Acrílico 2mm": 120.00, "MDF 3mm": 45.00 };
        let regrasFabrica = {};

        async function carregarDados() {
            const { data } = await supabaseClient.from('configuracoes').select('*').eq('id', 'padrao').single();
            if (data) {
                configApp = { ...configApp, ...data.globais };
                catalogoChapas = data.chapas || catalogoChapas;
                regrasFabrica = data.regras || {};
            }

            const response = await fetch('/api/index');
            produtosGlobais = await response.json();
            
            // Integra a comissão automática vinda do Python
            produtosGlobais.forEach(p => {
                if (!regrasFabrica[p.titulo]) {
                    regrasFabrica[p.titulo] = { material: Object.keys(catalogoChapas)[0], pecasPorPlaca: 440, tempoPorPlaca: 15, isKit: false, pecasPorKit: 1, comissaoML: p.comissao_ml, custoEnvio: 15, custoEmbalagem: 1.5 };
                } else {
                    // Atualiza a comissão com o valor lido da API
                    regrasFabrica[p.titulo].comissaoML = p.comissao_ml;
                }
            });

            document.getElementById('loading').classList.add('hidden');
            renderizarLista();
        }

        function renderizarLista() {
            const container = document.getElementById('lista-produtos');
            container.innerHTML = '';
            produtosGlobais.forEach(p => {
                const regra = regrasFabrica[p.titulo];
                const card = document.createElement('div');
                card.className = "bg-slate-800 p-4 rounded-xl border border-slate-700";
                card.innerHTML = `<h2 class="font-bold text-sm truncate">${p.titulo}</h2>
                                 <p class="text-xs text-slate-400">Comissão ML: ${regra.comissaoML}% | Envio: R$ ${regra.custoEnvio}</p>`;
                container.appendChild(card);
            });
        }

        async function salvarConfiguracoes() {
            await supabaseClient.from('configuracoes').upsert({
                id: 'padrao',
                globais: configApp,
                chapas: catalogoChapas,
                regras: regrasFabrica
            });
            alert('Salvo!');
        }

        document.addEventListener('DOMContentLoaded', carregarDados);
    </script>
</body>
</html>
