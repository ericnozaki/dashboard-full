<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Sete Laser - Full & Fábrica</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @media print {
            body { background: white !important; color: black !important; }
            header, .nav-container, #loading, .conteudo-aba, #modal-config { display: none !important; }
            #area-relatorio-pdf { display: block !important; width: 100%; font-size: 11px; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 md:p-6 pb-20">
    <div class="w-full max-w-7xl mx-auto">
        
        <!-- CABEÇALHO -->
        <header class="mb-4 flex flex-col md:flex-row justify-between items-center bg-slate-800 p-4 rounded-xl shadow-md border border-slate-700 gap-3">
            <div>
                <h1 class="text-xl md:text-2xl font-black text-white">📦 Painel Sete Laser</h1>
                <p class="text-slate-400 text-[10px] uppercase font-bold tracking-wider">Gestão Full & Produção</p>
            </div>
            <div class="flex gap-2">
                <button onclick="gerarRelatorioPDF()" class="bg-purple-600 px-3 py-2 rounded-lg font-bold text-xs">🖨️ Relatório</button>
                <button onclick="sincronizarPrecosML()" id="btn-sync" class="bg-amber-600 px-3 py-2 rounded-lg font-bold text-xs">🔄 Sync</button>
                <button onclick="abrirConfiguracoes()" class="bg-slate-700 px-3 py-2 rounded-lg font-bold text-xs">⚙️ Config.</button>
            </div>
        </header>

        <!-- NAVEGAÇÃO -->
        <div class="nav-container flex gap-1 mb-4 bg-slate-800 p-1 rounded-lg border border-slate-700">
            <button onclick="mudarAba('aba-envio')" id="btn-aba-envio" class="flex-1 py-2 rounded bg-blue-600 text-xs font-bold">🚚 ENVIO</button>
            <button onclick="mudarAba('aba-materia')" id="btn-aba-materia" class="flex-1 py-2 rounded text-xs font-bold text-slate-400">🛠️ MATÉRIAS</button>
            <button onclick="mudarAba('aba-producao')" id="btn-aba-producao" class="flex-1 py-2 rounded text-xs font-bold text-slate-400">⏱️ PRODUÇÃO</button>
            <button onclick="mudarAba('aba-financeiro')" id="btn-aba-financeiro" class="flex-1 py-2 rounded text-xs font-bold text-slate-400">💰 FINANCEIRO</button>
        </div>

        <div id="loading" class="text-center py-12 text-slate-400">Carregando...</div>

        <!-- ABA ENVIO -->
        <div id="aba-envio" class="conteudo-aba space-y-4">
            <div id="lista-produtos" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
        </div>
        
        <!-- ABAS Ocultas -->
        <div id="aba-materia" class="conteudo-aba hidden space-y-4">
            <div id="resumo-chapas-geral" class="grid grid-cols-1 md:grid-cols-3 gap-2"></div>
            <div id="lista-materia" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
        </div>
        <div id="aba-producao" class="conteudo-aba hidden space-y-4">
            <div id="lista-producao" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
        </div>
        <div id="aba-financeiro" class="conteudo-aba hidden space-y-4">
            <div id="lista-financeiro" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
        </div>
    </div>

    <!-- SCRIPT (O Mestre) -->
    <script>
        const SUPABASE_URL = 'https://nelpiazjlgwgmasaaxfg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5lbHBpYXpqbGd3Z21hc2FheGZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MDIyMjgsImV4cCI6MjEwMTM3ODIyOH0.433rc-W0GjIY3tii3-cnBJbtr1WX1ZbB50Htvv_Po90';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let produtosGlobais = [];
        let configApp = { diasMeta: 30, periodoBase: 30, margemSeguranca: 30, imposto: 6.0 };
        let catalogoChapas = { "PS 2mm": 76.00, "Acrílico 2mm": 120.00, "MDF 3mm": 45.00 };
        let regrasFabrica = {};

        async function carregarDados() {
            const { data } = await supabaseClient.from('configuracoes').select('*').eq('id', 'padrao').single();
            if (data) {
                configApp = { ...configApp, ...data.globais };
                catalogoChapas = data.chapas || catalogoChapas;
                regrasFabrica = data.regras || {};
            }

            const response = await fetch('/api/index');
            produtosGlobais = await response.json();
            
            produtosGlobais.forEach(p => {
                if (!regrasFabrica[p.titulo]) {
                    regrasFabrica[p.titulo] = { material: Object.keys(catalogoChapas)[0], pecasPorPlaca: 440, tempoPorPlaca: 15, isKit: false, pecasPorKit: 1, comissaoML: p.comissao_ml, custoEnvio: 15, custoEmbalagem: 1.5 };
                } else {
                    regrasFabrica[p.titulo].comissaoML = p.comissao_ml;
                }
            });
            document.getElementById('loading').classList.add('hidden');
            processarAbasFabricaFinanceiro();
        }

        function mudarAba(abaId) {
            ['aba-envio', 'aba-materia', 'aba-producao', 'aba-financeiro'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById(`btn-${id}`).className = "flex-1 py-2 rounded text-xs font-bold text-slate-400";
            });
            document.getElementById(abaId).classList.remove('hidden');
            document.getElementById(`btn-${abaId}`).className = "flex-1 py-2 rounded bg-blue-600 text-xs font-bold text-white";
        }

        function processarAbasFabricaFinanceiro() {
            renderizarListaEnvio();
        }

        function renderizarListaEnvio() {
            const container = document.getElementById('lista-produtos');
            container.innerHTML = '';
            produtosGlobais.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-slate-800 p-4 rounded-xl border border-slate-700";
                card.innerHTML = `<h2 class="font-bold text-sm">${p.titulo}</h2>
                                 <p class="text-xs text-slate-400">Comissão Automática: ${regrasFabrica[p.titulo]?.comissaoML}%</p>`;
                container.appendChild(card);
            });
        }
        
        // Mantemos a função de salvar intacta
        async function salvarConfiguracoes() { await supabaseClient.from('configuracoes').upsert({id: 'padrao', globais: configApp, chapas: catalogoChapas, regras: regrasFabrica}); alert('Salvo!'); }

        document.addEventListener('DOMContentLoaded', carregarDados);
    </script>
</body>
</html>
