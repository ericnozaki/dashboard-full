<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Reposição - Full</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 md:p-6">
    <div class="w-full max-w-xl mx-auto">
        <header class="mb-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-tight">📦 Painel Full</h1>
                <p class="text-slate-400 text-xs">Análise de cobertura (7 dias)</p>
            </div>
            <button onclick="carregarDados()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg font-medium transition text-xs">
                Atualizar
            </button>
        </header>

        <div id="loading" class="text-center py-12 text-slate-400 text-sm">Carregando dados...</div>

        <div id="lista-produtos" class="space-y-3 hidden">
            <!-- Os cards serão inseridos aqui via JavaScript -->
        </div>
    </div>

    <script>
        async function carregarDados() {
            const loading = document.getElementById('loading');
            const container = document.getElementById('lista-produtos');
            
            loading.classList.remove('hidden');
            container.classList.add('hidden');
            container.innerHTML = '';

            try {
                const response = await fetch('/api/index');
                const produtos = await response.json();

                if (produtos.error) {
                    loading.innerHTML = `<span class="text-red-400 text-xs">Erro: ${produtos.error}</span>`;
                    return;
                }

                produtos.forEach(p => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-800 border border-slate-700 rounded-xl p-3.5 shadow-md flex flex-col gap-2.5";
                    
                    const corBadge = p.semanas_7d <= 2 ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-slate-700 text-slate-300';
                    const textoCobertura = p.semanas_7d === 999 ? 'Estoque parado' : p.semanas_7d + ' sem.';

                    card.innerHTML = `
                        <h2 class="text-xs md:text-sm font-semibold text-slate-100 leading-snug">${p.titulo}</h2>
                        <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-700/60 text-center">
                            <div class="bg-slate-900/50 p-1.5 rounded-lg">
                                <span class="block text-[10px] text-slate-400 uppercase tracking-wider">Estoque</span>
                                <span class="text-sm font-bold text-blue-400">${p.estoque}</span>
                            </div>
                            <div class="bg-slate-900/50 p-1.5 rounded-lg">
                                <span class="block text-[10px] text-slate-400 uppercase tracking-wider">Vendas (7d)</span>
                                <span class="text-sm font-bold text-slate-200">${p.vendas_7d} un</span>
                            </div>
                            <div class="bg-slate-900/50 p-1.5 rounded-lg flex flex-col justify-center items-center">
                                <span class="block text-[10px] text-slate-400 uppercase tracking-wider">Cobertura</span>
                                <span class="px-2 py-0.5 rounded text-[11px] font-bold ${corBadge}">${textoCobertura}</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });

                loading.classList.add('hidden');
                container.classList.remove('hidden');
            } catch (err) {
                loading.innerHTML = `<span class="text-red-400 text-xs">Falha ao conectar com a API.</span>`;
            }
        }

        carregarDados();
    </script>
</body>
</html>
