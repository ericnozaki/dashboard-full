<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Reposição - Full</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 md:p-6">
    <div class="w-full max-w-xl mx-auto">
        <header class="mb-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-tight">📦 Painel Full</h1>
                <p class="text-slate-400 text-xs">Análise de cobertura e faturamento</p>
            </div>
            <button onclick="carregarDados()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg font-medium transition text-xs shadow-md">
                Atualizar
            </button>
        </header>

        <!-- Quadro de Resumo Financeiro -->
        <div class="mb-4 bg-gradient-to-r from-emerald-900 to-slate-800 border border-emerald-700/50 p-3 rounded-lg shadow-md flex justify-between items-center">
            <div>
                <p class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider mb-0.5">Total a Enviar</p>
                <p id="resumo-pecas" class="text-lg font-black text-white">0 un</p>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider mb-0.5">Potencial de Venda</p>
                <p id="resumo-valor" class="text-lg font-black text-emerald-300">R$ 0,00</p>
            </div>
        </div>

        <!-- Meta de Estoque Dinâmica -->
        <div class="mb-4 flex items-center justify-between bg-slate-800 border border-slate-700 p-2.5 rounded-lg shadow-sm">
            <label for="input-dias" class="text-[11px] md:text-xs text-slate-300 font-semibold tracking-wide flex items-center gap-1.5">
                ⏱️ META DE ESTOQUE (DIAS):
            </label>
            <div class="flex items-center gap-2">
                <input type="number" id="input-dias" value="30" min="1" max="365" 
                       class="bg-slate-900 border border-slate-600 rounded-md px-2 py-1.5 text-sm font-bold text-blue-400 w-20 text-center outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all" 
                       oninput="ordenar(ordemAtual.criterio, true)">
            </div>
        </div>

        <div class="mb-4 flex flex-wrap gap-1.5 text-xs">
            <button id="btn-criticos" onclick="ordenar('criticos')" class="bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-200 px-2 py-1.5 rounded-lg transition">⚠️ Menor Cobertura</button>
            <button id="btn-enviar" onclick="ordenar('enviar')" class="bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-200 px-2 py-1.5 rounded-lg transition">🚀 Maior Reposição</button>
            <button id="btn-estoque" onclick="ordenar('estoque')" class="bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-200 px-2 py-1.5 rounded-lg transition">📦 Maior Estoque</button>
            <button id="btn-vendas" onclick="ordenar('vendas')" class="bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-200 px-2 py-1.5 rounded-lg transition">🔥 Mais Vendidos</button>
        </div>

        <div id="loading" class="text-center py-12 text-slate-400 text-sm">Carregando dados...</div>
        <div id="lista-produtos" class="space-y-3 hidden"></div>
    </div>

    <script>
        let produtosGlobais = [];
        let ordemAtual = { criterio: 'criticos', crescente: true };
        const titulosBotoes = {
            'criticos': '⚠️ Menor Cobertura',
            'enviar': '🚀 Maior Reposição',
            'estoque': '📦 Maior Estoque',
            'vendas': '🔥 Mais Vendidos'
        };

        async function carregarDados() {
            const loading = document.getElementById('loading');
            const container = document.getElementById('lista-produtos');
            loading.classList.remove('hidden');
            container.classList.add('hidden');
            container.innerHTML = '';

            try {
                const response = await fetch('/api/index');
                produtosGlobais = await response.json();
                if (produtosGlobais.error) {
                    loading.innerHTML = `<span class="text-red-400 text-xs">Erro: ${produtosGlobais.error}</span>`;
                    return;
                }
                ordenar(ordemAtual.criterio, true); 
                loading.classList.add('hidden');
                container.classList.remove('hidden');
            } catch (err) {
                loading.innerHTML = `<span class="text-red-400 text-xs">Falha ao conectar com a API.</span>`;
            }
        }

        function atualizarEstiloBotoes() {
            Object.keys(titulosBotoes).forEach(criterio => {
                const btn = document.getElementById(`btn-${criterio}`);
                btn.className = "bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-200 px-2 py-1.5 rounded-lg transition";
                btn.innerText = titulosBotoes[criterio];
            });
            const btnAtivo = document.getElementById(`btn-${ordemAtual.criterio}`);
            btnAtivo.className = "bg-blue-600 border border-blue-500 text-white px-2 py-1.5 rounded-lg transition font-medium shadow-md";
            btnAtivo.innerText = titulosBotoes[ordemAtual.criterio] + (ordemAtual.crescente ? ' ↑' : ' ↓');
        }

        function calcularAEnviar(produto, diasMeta) {
            const vendaDiaria = produto.vendas_7d / 7.0;
            const estoqueIdeal = vendaDiaria * diasMeta;
            return Math.max(0, Math.round(estoqueIdeal - produto.estoque));
        }

        function ordenar(criterio, forcarRender = false) {
            if (!forcarRender) {
                if (ordemAtual.criterio === criterio) {
                    ordemAtual.crescente = !ordemAtual.crescente;
                } else {
                    ordemAtual.criterio = criterio;
                    ordemAtual.crescente = (criterio === 'criticos');
                }
            }

            const diasMeta = parseInt(document.getElementById('input-dias').value) || 30;

            produtosGlobais.sort((a, b) => {
                let valorA, valorB;
                if (criterio === 'criticos') { valorA = a.semanas_7d; valorB = b.semanas_7d; }
                else if (criterio === 'estoque') { valorA = a.estoque; valorB = b.estoque; }
                else if (criterio === 'vendas') { valorA = a.vendas_7d; valorB = b.vendas_7d; }
                else if (criterio === 'enviar') { 
                    valorA = calcularAEnviar(a, diasMeta); 
                    valorB = calcularAEnviar(b, diasMeta); 
                }
                if (valorA < valorB) return ordemAtual.crescente ? -1 : 1;
                if (valorA > valorB) return ordemAtual.crescente ? 1 : -1;
                return 0;
            });

            atualizarEstiloBotoes();
            renderizarProdutos(produtosGlobais, diasMeta);
        }

        function renderizarProdutos(lista, diasMeta) {
            const container = document.getElementById('lista-produtos');
            container.innerHTML = '';
            
            let totalPecas = 0;
            let totalValor = 0;

            lista.forEach(p => {
                const qtdEnviar = calcularAEnviar(p, diasMeta);
                totalPecas += qtdEnviar;
                totalValor += (qtdEnviar * p.preco);

                // Lógica do Semáforo
                let corSemaforo = '';
                let textoSemaforo = '';
                const diasCobertura = p.semanas_7d * 7;

                if (p.semanas_7d === 999 || p.vendas_7d === 0) {
                    corSemaforo = 'bg-slate-700 text-slate-300 border-slate-600';
                    textoSemaforo = '⚪ Parado';
                } else if (diasCobertura <= 7) {
                    corSemaforo = 'bg-red-500/20 text-red-400 border-red-500/30';
                    textoSemaforo = '🔴 Urgente';
                } else if (diasCobertura <= 14) {
                    corSemaforo = 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30';
                    textoSemaforo = '🟡 Atenção';
                } else if (diasCobertura > (diasMeta + 15)) {
                    corSemaforo = 'bg-blue-500/20 text-blue-400 border-blue-500/30';
                    textoSemaforo = '🔵 Excesso';
                } else {
                    corSemaforo = 'bg-green-500/20 text-green-400 border-green-500/30';
                    textoSemaforo = '🟢 Saudável';
                }

                const corEnviar = qtdEnviar > 0 ? 'text-green-400' : 'text-slate-500';
                
                const card = document.createElement('div');
                card.className = "bg-slate-800 border border-slate-700 rounded-xl p-3 shadow-md flex flex-col gap-2.5 relative";
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2">
                        <h2 class="text-[13px] md:text-sm font-semibold text-slate-100 leading-snug truncate">${p.titulo}</h2>
                        <span class="px-1.5 py-0.5 rounded text-[9px] font-bold border whitespace-nowrap ${corSemaforo}">${textoSemaforo}</span>
                    </div>
                    
                    <div class="grid grid-cols-4 gap-1.5 pt-2 border-t border-slate-700/60 text-center">
                        <div class="bg-slate-900/50 p-1.5 rounded-lg flex flex-col justify-center">
                            <span class="block text-[9px] text-slate-400 uppercase tracking-wider">Estoque</span>
                            <span class="text-[13px] font-bold text-blue-400">${p.estoque}</span>
                        </div>
                        <div class="bg-slate-900/50 p-1.5 rounded-lg flex flex-col justify-center">
                            <span class="block text-[9px] text-slate-400 uppercase tracking-wider">Vendas</span>
                            <span class="text-[13px] font-bold text-slate-200">${p.vendas_7d} un</span>
                        </div>
                        <div class="bg-slate-900/50 p-1.5 rounded-lg flex flex-col justify-center items-center">
                            <span class="block text-[9px] text-slate-400 uppercase tracking-wider">Preço</span>
                            <span class="text-[11px] font-bold text-emerald-400 whitespace-nowrap">R$ ${p.preco.toFixed(2).replace('.', ',')}</span>
                        </div>
                        <div class="bg-slate-900/50 p-1.5 rounded-lg flex flex-col justify-center border border-slate-700/50">
                            <span class="block text-[9px] text-slate-400 uppercase tracking-wider">A Enviar</span>
                            <span class="text-[13px] font-bold ${corEnviar}">+${qtdEnviar}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            // Atualiza os painéis de resumo
            document.getElementById('resumo-pecas').innerText = `${totalPecas} un`;
            document.getElementById('resumo-valor').innerText = totalValor.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
        }

        document.addEventListener('DOMContentLoaded', carregarDados);
    </script>
</body>
</html>
